<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-label="The three versions of README-LM"><title>The three versions of README-LM</title><style>:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e3e2de;--c1:#2a78d6;--c2:#eb6834}
@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#34342f;--c1:#3987e5;--c2:#d95926}}
text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.t2{fill:var(--ink2)} .bg{fill:var(--bg)} .grid{stroke:var(--grid);stroke-width:1} .c1{fill:var(--c1)} .c2{fill:var(--c2)}
.s1{stroke:var(--c1)} .s2{stroke:var(--c2)} .ring{fill:var(--bg);stroke:var(--c2);stroke-width:2.5}.node{fill:var(--node);stroke:var(--grid);stroke-width:1.5} .hl{stroke:var(--c1);stroke-width:2} .arr{stroke:var(--ink2);stroke-width:1.6;fill:none} .dash{stroke:var(--ink2);stroke-width:1.4;fill:none;stroke-dasharray:5 4} .ah{fill:var(--ink2)} .cap{fill:var(--ink2)} .ttl{font-weight:600}
:root{--node:#f3f2ee}@media (prefers-color-scheme: dark){:root{--node:#262624}}:root{--g:#1a7f37}@media (prefers-color-scheme: dark){:root{--g:#3fb950}} .gs{stroke:var(--g);stroke-width:2} .os{stroke:var(--c2);stroke-width:2} .gf{fill:var(--g)} .of{fill:var(--c2)} .wt{fill:#fff;font-weight:700}</style><rect class="bg" width="860" height="340" rx="10"/><text class="ttl" x="24" y="32" font-size="16">Three versions, one idea: how much of the arithmetic can a document renderer do?</text><text class="t2" x="24" y="52" font-size="12">In the live repo an Action also takes your typed text for B and C; opening the page or the SVG itself needs no Action.</text><rect class="node os" x="24.0" y="72" width="257.3" height="246" rx="12"/><rect class="of" x="38.0" y="86" width="229.3" height="24" rx="12"/><text class="wt" x="152.7" y="103" font-size="11" text-anchor="middle">NEEDS A MINIMAL ACTION</text><text class="ttl" x="40.0" y="140" font-size="20">A · Normal</text><text x="40.0" y="170" font-size="12.5">real GPT-2 (124M) + a 600K QA model</text><text x="40.0" y="192" font-size="12.5">weights are Markdown files</text><text x="40.0" y="214" font-size="12.5">the engine is one Markdown document</text><text x="40.0" y="236" font-size="12.5">plus one line of Python on an Action</text><text x="40.0" y="258" font-size="12.5"></text><text x="40.0" y="280" font-size="12.5" font-weight="600">issue  -&gt;  Action  -&gt;  animation</text><rect class="node gs" x="301.3" y="72" width="257.3" height="246" rx="12"/><rect class="gf" x="315.3" y="86" width="229.3" height="24" rx="12"/><text class="wt" x="430.0" y="103" font-size="11" text-anchor="middle">NO ACTION TO COMPUTE</text><text class="ttl" x="317.3" y="140" font-size="20">B · Pure MediaWiki</text><text x="317.3" y="170" font-size="12.5">a MediaWiki page of {{#expr}} formulas</text><text x="317.3" y="192" font-size="12.5">GitHub&#x27;s own renderer does the math</text><text x="317.3" y="214" font-size="12.5">verified 40/40 vs a Python reference</text><text x="317.3" y="236" font-size="12.5">a toy: 2-char context, 12 units</text><text x="317.3" y="258" font-size="12.5"></text><text x="317.3" y="280" font-size="12.5" font-weight="600">just open the page</text><rect class="node gs" x="578.7" y="72" width="257.3" height="246" rx="12"/><rect class="gf" x="592.7" y="86" width="229.3" height="24" rx="12"/><text class="wt" x="707.3" y="103" font-size="11" text-anchor="middle">NO ACTION TO COMPUTE</text><text class="ttl" x="594.7" y="140" font-size="20">C · Pure SVG</text><text x="594.7" y="170" font-size="12.5">a neural net drawn as SVG filters</text><text x="594.7" y="192" font-size="12.5">your browser&#x27;s filter engine computes</text><text x="594.7" y="214" font-size="12.5">224 ReLU units, bit-exact, no code</text><text x="594.7" y="236" font-size="12.5">Chrome, 100% zoom, 1x display</text><text x="594.7" y="258" font-size="12.5"></text><text x="594.7" y="280" font-size="12.5" font-weight="600">just open the SVG</text></svg>
