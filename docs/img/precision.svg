<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-label="Why 8 bits is the crux for SVG filters"><title>Why 8 bits is the crux for SVG filters</title><style>:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e3e2de;--c1:#2a78d6;--c2:#eb6834}
@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#34342f;--c1:#3987e5;--c2:#d95926}}
text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.t2{fill:var(--ink2)} .bg{fill:var(--bg)} .grid{stroke:var(--grid);stroke-width:1} .c1{fill:var(--c1)} .c2{fill:var(--c2)}
.s1{stroke:var(--c1)} .s2{stroke:var(--c2)} .ring{fill:var(--bg);stroke:var(--c2);stroke-width:2.5}</style><rect class="bg" width="760" height="350" rx="10"/><text x="24" y="32" font-size="16" font-weight="600">Why 8 bits is the crux for SVG filters</text><text class="t2" x="24" y="52" font-size="12">Share of QA answers exactly equal to the reference, by activation precision.</text><circle class="c1" cx="30" cy="70" r="5"/><text class="t2" x="42" y="74" font-size="12">no retraining (simulation)</text><circle class="c2" cx="250" cy="70" r="5"/><text class="t2" x="262" y="74" font-size="12">retrained at 8 bits (measured through the integer reference, 698 questions)</text><line class="grid" x1="70" x2="720" y1="290.0" y2="290.0"/><text class="t2" x="60" y="294.0" font-size="11" text-anchor="end">0%</text><line class="grid" x1="70" x2="720" y1="242.5" y2="242.5"/><text class="t2" x="60" y="246.5" font-size="11" text-anchor="end">25%</text><line class="grid" x1="70" x2="720" y1="195.0" y2="195.0"/><text class="t2" x="60" y="199.0" font-size="11" text-anchor="end">50%</text><line class="grid" x1="70" x2="720" y1="147.5" y2="147.5"/><text class="t2" x="60" y="151.5" font-size="11" text-anchor="end">75%</text><line class="grid" x1="70" x2="720" y1="100.0" y2="100.0"/><text class="t2" x="60" y="104.0" font-size="11" text-anchor="end">100%</text><line class="s1" x1="124.2" x2="124.2" y1="290.0" y2="138.0" stroke-width="3" stroke-linecap="round" opacity="0.5"/><circle class="c1" cx="124.2" cy="138.0" r="7"/><text x="124.2" y="124.0" font-size="13" font-weight="600" text-anchor="middle">80.0%</text><text class="t2" x="124.2" y="312" font-size="12" text-anchor="middle">8-bit,</text><text class="t2" x="124.2" y="327" font-size="12" text-anchor="middle">filter noise</text><line class="s1" x1="232.5" x2="232.5" y1="290.0" y2="123.8" stroke-width="3" stroke-linecap="round" opacity="0.5"/><circle class="c1" cx="232.5" cy="123.8" r="7"/><text x="232.5" y="109.8" font-size="13" font-weight="600" text-anchor="middle">87.5%</text><text class="t2" x="232.5" y="312" font-size="12" text-anchor="middle">8-bit</text><line class="s1" x1="340.8" x2="340.8" y1="290.0" y2="109.5" stroke-width="3" stroke-linecap="round" opacity="0.5"/><circle class="c1" cx="340.8" cy="109.5" r="7"/><text x="340.8" y="95.5" font-size="13" font-weight="600" text-anchor="middle">95.0%</text><text class="t2" x="340.8" y="312" font-size="12" text-anchor="middle">10-bit</text><line class="s1" x1="449.2" x2="449.2" y1="290.0" y2="104.8" stroke-width="3" stroke-linecap="round" opacity="0.5"/><circle class="c1" cx="449.2" cy="104.8" r="7"/><text x="449.2" y="90.8" font-size="13" font-weight="600" text-anchor="middle">97.5%</text><text class="t2" x="449.2" y="312" font-size="12" text-anchor="middle">16-bit</text><line class="s2" x1="557.5" x2="557.5" y1="290.0" y2="100.0" stroke-width="3" stroke-linecap="round" opacity="0.5"/><circle class="c2" cx="557.5" cy="100.0" r="7"/><text x="557.5" y="86.0" font-size="13" font-weight="600" text-anchor="middle">100.0%</text><text class="t2" x="557.5" y="312" font-size="12" text-anchor="middle">8-bit,</text><text class="t2" x="557.5" y="327" font-size="12" text-anchor="middle">retrained</text><line class="s2" x1="665.8" x2="665.8" y1="290.0" y2="106.8" stroke-width="3" stroke-linecap="round" opacity="0.5"/><circle class="c2" cx="665.8" cy="106.8" r="7"/><text x="665.8" y="92.8" font-size="13" font-weight="600" text-anchor="middle">96.4%</text><text class="t2" x="665.8" y="312" font-size="12" text-anchor="middle">retrained,</text><text class="t2" x="665.8" y="327" font-size="12" text-anchor="middle">+-2 level noise</text></svg>
