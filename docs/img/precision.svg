<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="Why 8 bits is the crux for SVG filters"><title>Why 8 bits is the crux for SVG filters</title><style>:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e3e2de;--c1:#2a78d6;--c2:#eb6834}
@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#34342f;--c1:#3987e5;--c2:#d95926}}
text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.t2{fill:var(--ink2)} .bg{fill:var(--bg)} .grid{stroke:var(--grid);stroke-width:1} .c1{fill:var(--c1)} .c2{fill:var(--c2)}
.s1{stroke:var(--c1)} .s2{stroke:var(--c2)} .ring{fill:var(--bg);stroke:var(--c2);stroke-width:2.5}</style><rect class="bg" width="760" height="340" rx="10"/><text x="24" y="32" font-size="16" font-weight="600">Why 8 bits is the crux for SVG filters</text><text class="t2" x="24" y="52" font-size="12">Simulated share of QA answers exactly equal to the reference, by activation precision (no retraining).</text><line class="grid" x1="70" x2="720" y1="280.0" y2="280.0"/><text class="t2" x="60" y="284.0" font-size="11" text-anchor="end">0%</text><line class="grid" x1="70" x2="720" y1="231.0" y2="231.0"/><text class="t2" x="60" y="235.0" font-size="11" text-anchor="end">25%</text><line class="grid" x1="70" x2="720" y1="182.0" y2="182.0"/><text class="t2" x="60" y="186.0" font-size="11" text-anchor="end">50%</text><line class="grid" x1="70" x2="720" y1="133.0" y2="133.0"/><text class="t2" x="60" y="137.0" font-size="11" text-anchor="end">75%</text><line class="grid" x1="70" x2="720" y1="84.0" y2="84.0"/><text class="t2" x="60" y="88.0" font-size="11" text-anchor="end">100%</text><line class="s1" x1="151.2" x2="151.2" y1="280.0" y2="123.2" stroke-width="3" stroke-linecap="round" opacity="0.5"/><circle class="c1" cx="151.2" cy="123.2" r="7"/><text x="151.2" y="109.2" font-size="13" font-weight="600" text-anchor="middle">80.0%</text><text class="t2" x="151.2" y="302" font-size="12" text-anchor="middle">8-bit, with the</text><text class="t2" x="151.2" y="317" font-size="12" text-anchor="middle">filter&#x27;s own noise</text><line class="s1" x1="313.8" x2="313.8" y1="280.0" y2="108.5" stroke-width="3" stroke-linecap="round" opacity="0.5"/><circle class="c1" cx="313.8" cy="108.5" r="7"/><text x="313.8" y="94.5" font-size="13" font-weight="600" text-anchor="middle">87.5%</text><text class="t2" x="313.8" y="302" font-size="12" text-anchor="middle">8-bit</text><line class="s1" x1="476.2" x2="476.2" y1="280.0" y2="93.8" stroke-width="3" stroke-linecap="round" opacity="0.5"/><circle class="c1" cx="476.2" cy="93.8" r="7"/><text x="476.2" y="79.8" font-size="13" font-weight="600" text-anchor="middle">95.0%</text><text class="t2" x="476.2" y="302" font-size="12" text-anchor="middle">10-bit</text><line class="s1" x1="638.8" x2="638.8" y1="280.0" y2="88.9" stroke-width="3" stroke-linecap="round" opacity="0.5"/><circle class="c1" cx="638.8" cy="88.9" r="7"/><text x="638.8" y="74.9" font-size="13" font-weight="600" text-anchor="middle">97.5%</text><text class="t2" x="638.8" y="302" font-size="12" text-anchor="middle">16-bit</text></svg>
