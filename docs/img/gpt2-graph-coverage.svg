<svg xmlns="http://www.w3.org/2000/svg" width="760" height="412" viewBox="0 0 760 412" role="img" aria-label="How long real GPT-2 text stays inside a 2,000-state link graph"><title>How long real GPT-2 text stays inside a 2,000-state link graph</title><style>:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e3e2de;--c1:#2a78d6;--c2:#eb6834}
@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#34342f;--c1:#3987e5;--c2:#d95926}}
text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.t2{fill:var(--ink2)} .bg{fill:var(--bg)} .grid{stroke:var(--grid);stroke-width:1} .c1{fill:var(--c1)} .c2{fill:var(--c2)}
.s1{stroke:var(--c1)} .s2{stroke:var(--c2)} .ring{fill:var(--bg);stroke:var(--c2);stroke-width:2.5}</style><rect class="bg" width="760" height="412" rx="10"/><text x="24" y="32" font-size="16" font-weight="600">How long real GPT-2 text stays inside a 2,000-state link graph</text><text class="t2" x="24" y="52" font-size="12">Chance a sampled continuation is still in the graph after 8 tokens (temperature 0.6).</text><line class="grid" x1="300.0" x2="300.0" y1="76" y2="390"/><text class="t2" x="300.0" y="406" font-size="11" text-anchor="middle">0%</text><line class="grid" x1="400.0" x2="400.0" y1="76" y2="390"/><text class="t2" x="400.0" y="406" font-size="11" text-anchor="middle">25%</text><line class="grid" x1="500.0" x2="500.0" y1="76" y2="390"/><text class="t2" x="500.0" y="406" font-size="11" text-anchor="middle">50%</text><line class="grid" x1="600.0" x2="600.0" y1="76" y2="390"/><text class="t2" x="600.0" y="406" font-size="11" text-anchor="middle">75%</text><line class="grid" x1="700.0" x2="700.0" y1="76" y2="390"/><text class="t2" x="700.0" y="406" font-size="11" text-anchor="middle">100%</text><text x="288" y="95" font-size="12" text-anchor="end">1, 2, 3, 4, 5,</text><rect class="c1" x="300" y="84" width="282.6" height="14" rx="4"/><text x="590.6" y="95" font-size="12" font-weight="600">70.7%</text><text x="288" y="121" font-size="12" text-anchor="end">Q: What is the capital of France? A:</text><rect class="c1" x="300" y="110" width="216.2" height="14" rx="4"/><text x="524.2" y="121" font-size="12" font-weight="600">54.0%</text><text x="288" y="147" font-size="12" text-anchor="end">The Eiffel Tower is located in</text><rect class="c1" x="300" y="136" width="66.6" height="14" rx="4"/><text x="374.6" y="147" font-size="12" font-weight="600">16.7%</text><text x="288" y="173" font-size="12" text-anchor="end">The capital of France is</text><rect class="c1" x="300" y="162" width="46.0" height="14" rx="4"/><text x="354.0" y="173" font-size="12" font-weight="600">11.5%</text><text x="288" y="199" font-size="12" text-anchor="end">Q: Who wrote Hamlet? A:</text><rect class="c1" x="300" y="188" width="35.0" height="14" rx="4"/><text x="343.0" y="199" font-size="12" font-weight="600">8.7%</text><text x="288" y="225" font-size="12" text-anchor="end">GitHub is</text><rect class="c1" x="300" y="214" width="31.8" height="14" rx="4"/><text x="339.8" y="225" font-size="12" font-weight="600">8.0%</text><text x="288" y="251" font-size="12" text-anchor="end">The meaning of life is</text><rect class="c1" x="300" y="240" width="22.8" height="14" rx="4"/><text x="330.8" y="251" font-size="12" font-weight="600">5.7%</text><text x="288" y="277" font-size="12" text-anchor="end">Water boils at 100 degrees</text><rect class="c1" x="300" y="266" width="20.1" height="14" rx="4"/><text x="328.1" y="277" font-size="12" font-weight="600">5.0%</text><text x="288" y="303" font-size="12" text-anchor="end">To be, or not to be,</text><rect class="c1" x="300" y="292" width="8.5" height="14" rx="4"/><text x="316.5" y="303" font-size="12" font-weight="600">2.1%</text><text x="288" y="329" font-size="12" text-anchor="end">Markdown is</text><rect class="c1" x="300" y="318" width="5.2" height="14" rx="4"/><text x="313.2" y="329" font-size="12" font-weight="600">1.3%</text><text x="288" y="355" font-size="12" text-anchor="end">Once upon a time</text><rect class="c1" x="300" y="344" width="3.0" height="14" rx="4"/><text x="311.0" y="355" font-size="12" font-weight="600">0.7%</text><text x="288" y="381" font-size="12" text-anchor="end">Roses are red, violets are</text><rect class="c1" x="300" y="370" width="3.0" height="14" rx="4"/><text x="311.0" y="381" font-size="12" font-weight="600">0.2%</text></svg>
