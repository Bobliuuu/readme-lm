<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="Where the arithmetic can happen"><title>Where the arithmetic can happen</title><style>:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e3e2de;--c1:#2a78d6;--c2:#eb6834}
@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#34342f;--c1:#3987e5;--c2:#d95926}}
text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.t2{fill:var(--ink2)} .bg{fill:var(--bg)} .grid{stroke:var(--grid);stroke-width:1} .c1{fill:var(--c1)} .c2{fill:var(--c2)}
.s1{stroke:var(--c1)} .s2{stroke:var(--c2)} .ring{fill:var(--bg);stroke:var(--c2);stroke-width:2.5}.node{fill:var(--node);stroke:var(--grid);stroke-width:1.5} .hl{stroke:var(--c1);stroke-width:2} .arr{stroke:var(--ink2);stroke-width:1.6;fill:none} .dash{stroke:var(--ink2);stroke-width:1.4;fill:none;stroke-dasharray:5 4} .ah{fill:var(--ink2)} .cap{fill:var(--ink2)} .ttl{font-weight:600}
:root{--node:#f3f2ee}@media (prefers-color-scheme: dark){:root{--node:#262624}}</style><rect class="bg" width="860" height="300" rx="10"/><text class="ttl" x="24" y="32" font-size="16">Where the arithmetic can happen</text><text class="t2" x="24" y="52" font-size="12">Three places we ran a language model, by who does the multiply-accumulates.</text><rect class="node" x="24.0" y="76" width="257.3" height="196" rx="10"/><text class="ttl" x="40.0" y="104" font-size="14">Fast version</text><text x="40.0" y="130" font-size="12.5">GitHub Action runner</text><text x="40.0" y="151" font-size="12.5">numpy engine extracted</text><text x="40.0" y="172" font-size="12.5">from a Markdown document</text><text x="40.0" y="193" font-size="12.5"></text><text x="40.0" y="214" font-size="12.5">real GPT-2 and the QA model</text><rect class="node hl" x="301.3" y="76" width="257.3" height="196" rx="10"/><text class="ttl" x="317.3" y="104" font-size="14">Pure markup (secondary build)</text><text x="317.3" y="130" font-size="12.5">GitHub&#x27;s MediaWiki renderer:</text><text x="317.3" y="151" font-size="12.5">{{#expr}} in the page</text><text x="317.3" y="172" font-size="12.5">WORKS (toy, verified live)</text><text x="317.3" y="193" font-size="12.5"></text><text x="317.3" y="214" font-size="12.5">SVG filters in the viewer&#x27;s browser:</text><text x="317.3" y="235" font-size="12.5">every op exact in Chrome; the full</text><text x="317.3" y="256" font-size="12.5">chain does not render yet</text><rect class="node" x="578.7" y="76" width="257.3" height="196" rx="10"/><text class="ttl" x="594.7" y="104" font-size="14">Probed, not shipped</text><text x="594.7" y="130" font-size="12.5">XSLT: works, Chrome removes it</text><text x="594.7" y="151" font-size="12.5">on 2026-11-17</text><text x="594.7" y="172" font-size="12.5">Liquid in Jekyll: exact but slow</text><text x="594.7" y="193" font-size="12.5">CSS + fonts: feasible, slowest,</text><text x="594.7" y="214" font-size="12.5">last resort</text></svg>
