<svg xmlns="http://www.w3.org/2000/svg" width="860" height="318" viewBox="0 0 860 318" role="img" aria-label="The fast version, end to end"><title>The fast version, end to end</title><style>:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e3e2de;--c1:#2a78d6;--c2:#eb6834}
@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#34342f;--c1:#3987e5;--c2:#d95926}}
text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.t2{fill:var(--ink2)} .bg{fill:var(--bg)} .grid{stroke:var(--grid);stroke-width:1} .c1{fill:var(--c1)} .c2{fill:var(--c2)}
.s1{stroke:var(--c1)} .s2{stroke:var(--c2)} .ring{fill:var(--bg);stroke:var(--c2);stroke-width:2.5}.node{fill:var(--node);stroke:var(--grid);stroke-width:1.5} .hl{stroke:var(--c1);stroke-width:2} .arr{stroke:var(--ink2);stroke-width:1.6;fill:none} .dash{stroke:var(--ink2);stroke-width:1.4;fill:none;stroke-dasharray:5 4} .ah{fill:var(--ink2)} .cap{fill:var(--ink2)} .ttl{font-weight:600}
:root{--node:#f3f2ee}@media (prefers-color-scheme: dark){:root{--node:#262624}}</style><rect class="bg" width="860" height="318" rx="10"/><text class="ttl" x="24" y="32" font-size="16">The fast version, end to end</text><text class="t2" x="24" y="52" font-size="12">A GitHub Action only does I/O; the extracted engine does the arithmetic.</text><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="node" x="24.0" y="78" width="248.0" height="66" rx="9"/><text x="148.0" y="107.0" font-size="12.5" text-anchor="middle">Viewer opens an issue</text><text x="148.0" y="123.0" font-size="12.5" text-anchor="middle">gpt2: ...  or  qa: ...</text><rect class="node" x="306.0" y="78" width="248.0" height="66" rx="9"/><text x="430.0" y="115.0" font-size="12.5" text-anchor="middle">GitHub issue</text><line class="arr" x1="274.0" y1="111.0" x2="303.0" y2="111.0" marker-end="url(#ah)"/><rect class="node" x="588.0" y="78" width="248.0" height="66" rx="9"/><text x="712.0" y="107.0" font-size="12.5" text-anchor="middle">GitHub Action runner</text><text x="712.0" y="123.0" font-size="12.5" text-anchor="middle">(only does I/O)</text><line class="arr" x1="556.0" y1="111.0" x2="585.0" y2="111.0" marker-end="url(#ah)"/><rect class="node" x="24.0" y="196" width="177.5" height="66" rx="9"/><text x="112.8" y="217.0" font-size="12.5" text-anchor="middle">mdrt/GPT2.md or QA.md</text><text x="112.8" y="233.0" font-size="12.5" text-anchor="middle">engine + program + tokenizer</text><text x="112.8" y="249.0" font-size="12.5" text-anchor="middle">are all Markdown</text><rect class="node hl" x="235.5" y="196" width="177.5" height="66" rx="9"/><text x="324.2" y="217.0" font-size="12.5" text-anchor="middle">extracted engine runs the</text><text x="324.2" y="233.0" font-size="12.5" text-anchor="middle">forward pass in numpy</text><text x="324.2" y="249.0" font-size="12.5" text-anchor="middle">(reads the weight shards)</text><line class="arr" x1="203.5" y1="229.0" x2="232.5" y2="229.0" marker-end="url(#ah)"/><rect class="node" x="447.0" y="196" width="177.5" height="66" rx="9"/><text x="535.8" y="225.0" font-size="12.5" text-anchor="middle">rendered Markdown</text><text x="535.8" y="241.0" font-size="12.5" text-anchor="middle">+ typing animation</text><line class="arr" x1="415.0" y1="229.0" x2="444.0" y2="229.0" marker-end="url(#ah)"/><rect class="node" x="658.5" y="196" width="177.5" height="66" rx="9"/><text x="747.2" y="225.0" font-size="12.5" text-anchor="middle">issue reply and</text><text x="747.2" y="241.0" font-size="12.5" text-anchor="middle">README image</text><line class="arr" x1="626.5" y1="229.0" x2="655.5" y2="229.0" marker-end="url(#ah)"/><path class="arr" d="M712.0,144 L712.0,170.0 L112.8,170.0 L112.8,193" marker-end="url(#ah)"/><text class="cap" x="24" y="306" font-size="12">Weights are Markdown too: gpt2/*.md shards and qa/weights.md.</text></svg>
