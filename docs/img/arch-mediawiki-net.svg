<svg xmlns="http://www.w3.org/2000/svg" width="860" height="318" viewBox="0 0 860 318" role="img" aria-label="How the pure-markup net works"><title>How the pure-markup net works</title><style>:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e3e2de;--c1:#2a78d6;--c2:#eb6834}
@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#34342f;--c1:#3987e5;--c2:#d95926}}
text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.t2{fill:var(--ink2)} .bg{fill:var(--bg)} .grid{stroke:var(--grid);stroke-width:1} .c1{fill:var(--c1)} .c2{fill:var(--c2)}
.s1{stroke:var(--c1)} .s2{stroke:var(--c2)} .ring{fill:var(--bg);stroke:var(--c2);stroke-width:2.5}.node{fill:var(--node);stroke:var(--grid);stroke-width:1.5} .hl{stroke:var(--c1);stroke-width:2} .arr{stroke:var(--ink2);stroke-width:1.6;fill:none} .dash{stroke:var(--ink2);stroke-width:1.4;fill:none;stroke-dasharray:5 4} .ah{fill:var(--ink2)} .cap{fill:var(--ink2)} .ttl{font-weight:600}
:root{--node:#f3f2ee}@media (prefers-color-scheme: dark){:root{--node:#262624}}</style><rect class="bg" width="860" height="318" rx="10"/><text class="ttl" x="24" y="32" font-size="16">How the pure-markup net works</text><text class="t2" x="24" y="52" font-size="12">GitHub&#x27;s own renderer evaluates every expression when the page loads.</text><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="node" x="24.0" y="78" width="248.0" height="66" rx="9"/><text x="148.0" y="107.0" font-size="12.5" text-anchor="middle">trained weights</text><text x="148.0" y="123.0" font-size="12.5" text-anchor="middle">(small integers)</text><rect class="node" x="306.0" y="78" width="248.0" height="66" rx="9"/><text x="430.0" y="99.0" font-size="12.5" text-anchor="middle">gen_mediawiki.py</text><text x="430.0" y="115.0" font-size="12.5" text-anchor="middle">unrolls every neuron</text><text x="430.0" y="131.0" font-size="12.5" text-anchor="middle">inline</text><line class="arr" x1="274.0" y1="111.0" x2="303.0" y2="111.0" marker-end="url(#ah)"/><rect class="node" x="588.0" y="78" width="248.0" height="66" rx="9"/><text x="712.0" y="99.0" font-size="12.5" text-anchor="middle">README.mediawiki</text><text x="712.0" y="115.0" font-size="12.5" text-anchor="middle">{{#expr: ...}}</text><text x="712.0" y="131.0" font-size="12.5" text-anchor="middle">everywhere</text><line class="arr" x1="556.0" y1="111.0" x2="585.0" y2="111.0" marker-end="url(#ah)"/><rect class="node hl" x="24.0" y="196" width="248.0" height="66" rx="9"/><text x="148.0" y="217.0" font-size="12.5" text-anchor="middle">GitHub&#x27;s renderer</text><text x="148.0" y="233.0" font-size="12.5" text-anchor="middle">evaluates every</text><text x="148.0" y="249.0" font-size="12.5" text-anchor="middle">expression at render time</text><rect class="node" x="306.0" y="196" width="248.0" height="66" rx="9"/><text x="430.0" y="217.0" font-size="12.5" text-anchor="middle">table: predicted next</text><text x="430.0" y="233.0" font-size="12.5" text-anchor="middle">character per input</text><text x="430.0" y="249.0" font-size="12.5" text-anchor="middle">context, live</text><line class="arr" x1="274.0" y1="229.0" x2="303.0" y2="229.0" marker-end="url(#ah)"/><rect class="node" x="588.0" y="196" width="248.0" height="66" rx="9"/><text x="712.0" y="217.0" font-size="12.5" text-anchor="middle">check_live.py compares</text><text x="712.0" y="233.0" font-size="12.5" text-anchor="middle">with a python reference:</text><text x="712.0" y="249.0" font-size="12.5" text-anchor="middle">40/40 exact</text><line class="arr" x1="556.0" y1="229.0" x2="585.0" y2="229.0" marker-end="url(#ah)"/><path class="arr" d="M712.0,144 L712.0,170.0 L148.0,170.0 L148.0,193" marker-end="url(#ah)"/></svg>
