<svg xmlns="http://www.w3.org/2000/svg" width="860" height="318" viewBox="0 0 860 318" role="img" aria-label="Inside the QA transformer"><title>Inside the QA transformer</title><style>:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e3e2de;--c1:#2a78d6;--c2:#eb6834}
@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#34342f;--c1:#3987e5;--c2:#d95926}}
text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.t2{fill:var(--ink2)} .bg{fill:var(--bg)} .grid{stroke:var(--grid);stroke-width:1} .c1{fill:var(--c1)} .c2{fill:var(--c2)}
.s1{stroke:var(--c1)} .s2{stroke:var(--c2)} .ring{fill:var(--bg);stroke:var(--c2);stroke-width:2.5}.node{fill:var(--node);stroke:var(--grid);stroke-width:1.5} .hl{stroke:var(--c1);stroke-width:2} .arr{stroke:var(--ink2);stroke-width:1.6;fill:none} .dash{stroke:var(--ink2);stroke-width:1.4;fill:none;stroke-dasharray:5 4} .ah{fill:var(--ink2)} .cap{fill:var(--ink2)} .ttl{font-weight:600}
:root{--node:#f3f2ee}@media (prefers-color-scheme: dark){:root{--node:#262624}}</style><rect class="bg" width="860" height="318" rx="10"/><text class="ttl" x="24" y="32" font-size="16">Inside the QA transformer</text><text class="t2" x="24" y="52" font-size="12">600K parameters, character-level, 4-bit weights. Small enough to live inside a README.</text><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="node" x="24.0" y="78" width="107.0" height="66" rx="9"/><text x="77.5" y="99.0" font-size="12.5" text-anchor="middle">tokens</text><text x="77.5" y="115.0" font-size="12.5" text-anchor="middle">(86-character</text><text x="77.5" y="131.0" font-size="12.5" text-anchor="middle">vocabulary)</text><rect class="node" x="165.0" y="78" width="107.0" height="66" rx="9"/><text x="218.5" y="99.0" font-size="12.5" text-anchor="middle">embedding 86x128</text><text x="218.5" y="115.0" font-size="12.5" text-anchor="middle">(shared with the</text><text x="218.5" y="131.0" font-size="12.5" text-anchor="middle">output head)</text><line class="arr" x1="133.0" y1="111.0" x2="162.0" y2="111.0" marker-end="url(#ah)"/><rect class="node hl" x="306.0" y="78" width="107.0" height="66" rx="9"/><text x="359.5" y="107.0" font-size="12.5" text-anchor="middle">3 identical</text><text x="359.5" y="123.0" font-size="12.5" text-anchor="middle">blocks (below)</text><line class="arr" x1="274.0" y1="111.0" x2="303.0" y2="111.0" marker-end="url(#ah)"/><rect class="node" x="447.0" y="78" width="107.0" height="66" rx="9"/><text x="500.5" y="107.0" font-size="12.5" text-anchor="middle">final</text><text x="500.5" y="123.0" font-size="12.5" text-anchor="middle">RMSNorm</text><line class="arr" x1="415.0" y1="111.0" x2="444.0" y2="111.0" marker-end="url(#ah)"/><rect class="node" x="588.0" y="78" width="107.0" height="66" rx="9"/><text x="641.5" y="107.0" font-size="12.5" text-anchor="middle">tied head</text><text x="641.5" y="123.0" font-size="12.5" text-anchor="middle">128 to 86</text><line class="arr" x1="556.0" y1="111.0" x2="585.0" y2="111.0" marker-end="url(#ah)"/><rect class="node" x="729.0" y="78" width="107.0" height="66" rx="9"/><text x="782.5" y="99.0" font-size="12.5" text-anchor="middle">argmax:</text><text x="782.5" y="115.0" font-size="12.5" text-anchor="middle">the next</text><text x="782.5" y="131.0" font-size="12.5" text-anchor="middle">character</text><line class="arr" x1="697.0" y1="111.0" x2="726.0" y2="111.0" marker-end="url(#ah)"/><rect class="node" x="24.0" y="196" width="86.9" height="66" rx="9"/><text x="67.4" y="233.0" font-size="12.5" text-anchor="middle">RMSNorm</text><rect class="node" x="144.9" y="196" width="86.9" height="66" rx="9"/><text x="188.3" y="217.0" font-size="12.5" text-anchor="middle">linear</text><text x="188.3" y="233.0" font-size="12.5" text-anchor="middle">128 to 384</text><text x="188.3" y="249.0" font-size="12.5" text-anchor="middle">(q, k, v)</text><line class="arr" x1="112.9" y1="229.0" x2="141.9" y2="229.0" marker-end="url(#ah)"/><rect class="node" x="265.7" y="196" width="86.9" height="66" rx="9"/><text x="309.1" y="217.0" font-size="12.5" text-anchor="middle">RoPE on q, k</text><text x="309.1" y="233.0" font-size="12.5" text-anchor="middle">causal attention</text><text x="309.1" y="249.0" font-size="12.5" text-anchor="middle">4 heads x 32</text><line class="arr" x1="233.7" y1="229.0" x2="262.7" y2="229.0" marker-end="url(#ah)"/><rect class="node" x="386.6" y="196" width="86.9" height="66" rx="9"/><text x="430.0" y="217.0" font-size="12.5" text-anchor="middle">linear</text><text x="430.0" y="233.0" font-size="12.5" text-anchor="middle">128 to 128</text><text x="430.0" y="249.0" font-size="12.5" text-anchor="middle">+ residual</text><line class="arr" x1="354.6" y1="229.0" x2="383.6" y2="229.0" marker-end="url(#ah)"/><rect class="node" x="507.4" y="196" width="86.9" height="66" rx="9"/><text x="550.9" y="217.0" font-size="12.5" text-anchor="middle">RMSNorm</text><text x="550.9" y="233.0" font-size="12.5" text-anchor="middle">linear</text><text x="550.9" y="249.0" font-size="12.5" text-anchor="middle">128 to 512</text><line class="arr" x1="475.4" y1="229.0" x2="504.4" y2="229.0" marker-end="url(#ah)"/><rect class="node" x="628.3" y="196" width="86.9" height="66" rx="9"/><text x="671.7" y="233.0" font-size="12.5" text-anchor="middle">GELU</text><line class="arr" x1="596.3" y1="229.0" x2="625.3" y2="229.0" marker-end="url(#ah)"/><rect class="node" x="749.1" y="196" width="86.9" height="66" rx="9"/><text x="792.6" y="217.0" font-size="12.5" text-anchor="middle">linear</text><text x="792.6" y="233.0" font-size="12.5" text-anchor="middle">512 to 128</text><text x="792.6" y="249.0" font-size="12.5" text-anchor="middle">+ residual</text><line class="arr" x1="717.1" y1="229.0" x2="746.1" y2="229.0" marker-end="url(#ah)"/><path class="arr" d="M782.5,144 L782.5,170.0 L67.4,170.0 L67.4,193" marker-end="url(#ah)"/><text class="cap" x="24" y="306" font-size="12">Each block is the row above: attention sub-block (left four) then feed-forward sub-block (right three), each added back to the stream.</text></svg>
