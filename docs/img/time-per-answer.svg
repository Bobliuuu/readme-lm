<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="Time to produce one QA answer, by where the arithmetic runs"><title>Time to produce one QA answer, by where the arithmetic runs</title><style>:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e3e2de;--c1:#2a78d6;--c2:#eb6834}
@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#34342f;--c1:#3987e5;--c2:#d95926}}
text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.t2{fill:var(--ink2)} .bg{fill:var(--bg)} .grid{stroke:var(--grid);stroke-width:1} .c1{fill:var(--c1)} .c2{fill:var(--c2)}
.s1{stroke:var(--c1)} .s2{stroke:var(--c2)} .ring{fill:var(--bg);stroke:var(--c2);stroke-width:2.5}</style><rect class="bg" width="760" height="330" rx="10"/><text x="24" y="32" font-size="16" font-weight="600">Time to produce one QA answer, by where the arithmetic runs</text><text class="t2" x="24" y="52" font-size="12">Log scale. Filled = measured on a laptop. Ringed = extrapolated from measured throughput or published numbers.</text><line class="grid" x1="300.0" x2="300.0" y1="76" y2="280"/><text class="t2" x="300.0" y="298" font-size="11" text-anchor="middle">0.1 s</text><line class="grid" x1="384.0" x2="384.0" y1="76" y2="280"/><text class="t2" x="384.0" y="298" font-size="11" text-anchor="middle">1 s</text><line class="grid" x1="468.0" x2="468.0" y1="76" y2="280"/><text class="t2" x="468.0" y="298" font-size="11" text-anchor="middle">10 s</text><line class="grid" x1="552.0" x2="552.0" y1="76" y2="280"/><text class="t2" x="552.0" y="298" font-size="11" text-anchor="middle">100 s</text><line class="grid" x1="636.0" x2="636.0" y1="76" y2="280"/><text class="t2" x="636.0" y="298" font-size="11" text-anchor="middle">1,000 s</text><line class="grid" x1="720.0" x2="720.0" y1="76" y2="280"/><text class="t2" x="720.0" y="298" font-size="11" text-anchor="middle">10,000 s</text><text x="286" y="96" font-size="12.5" text-anchor="end">numpy engine in an Action (one QA answer)</text><circle class="c1" cx="325.3" cy="92" r="6.5"/><text x="339.3" y="96" font-size="12" font-weight="600">0.2 s</text><text x="286" y="138" font-size="12.5" text-anchor="end">XSLT in Chrome 156 (full QA answer)</text><circle class="c1" cx="569.8" cy="134" r="6.5"/><text x="583.8" y="138" font-size="12" font-weight="600">163 s</text><text x="286" y="180" font-size="12.5" text-anchor="end">XSLT with xsltproc (same answer)</text><circle class="c1" cx="576.7" cy="176" r="6.5"/><text x="590.7" y="180" font-size="12" font-weight="600">197 s</text><text x="286" y="222" font-size="12.5" text-anchor="end">Liquid in a Jekyll build</text><line class="s2" x1="636.7" x2="646.1" y1="218" y2="218" stroke-width="4" stroke-linecap="round" opacity="0.55"/><circle class="ring" cx="636.7" cy="218" r="6"/><text x="658.1" y="222" font-size="12" font-weight="600">17-22 min</text><text x="286" y="264" font-size="12.5" text-anchor="end">CSS + variable fonts, scaled from the blog</text><line class="s2" x1="620.8" x2="685.6" y1="260" y2="260" stroke-width="4" stroke-linecap="round" opacity="0.55"/><circle class="ring" cx="620.8" cy="260" r="6"/><text x="608.8" y="250" font-size="12" font-weight="600" text-anchor="end">11-65 min</text></svg>
