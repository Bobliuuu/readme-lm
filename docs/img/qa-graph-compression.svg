<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-label="QA click-graph size for 701 questions"><title>QA click-graph size for 701 questions</title><style>:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e3e2de;--c1:#2a78d6;--c2:#eb6834}
@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#34342f;--c1:#3987e5;--c2:#d95926}}
text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.t2{fill:var(--ink2)} .bg{fill:var(--bg)} .grid{stroke:var(--grid);stroke-width:1} .c1{fill:var(--c1)} .c2{fill:var(--c2)}
.s1{stroke:var(--c1)} .s2{stroke:var(--c2)} .ring{fill:var(--bg);stroke:var(--c2);stroke-width:2.5}</style><rect class="bg" width="760" height="220" rx="10"/><text x="24" y="32" font-size="16" font-weight="600">QA click-graph size for 701 questions</text><text class="t2" x="24" y="52" font-size="12">States a reader would have to click through. Runs where the model has a single confident continuation merge into one link.</text><text x="238" y="102" font-size="12.5" text-anchor="end">one state per character</text><rect class="c1" x="250" y="90" width="420.0" height="16" rx="4"/><text x="678.0" y="103" font-size="13" font-weight="600">72,061</text><text x="238" y="148" font-size="12.5" text-anchor="end">after merging single-continuation runs</text><rect class="c1" x="250" y="136" width="8.3" height="16" rx="4"/><text x="266.3" y="149" font-size="13" font-weight="600">1,425</text><text class="t2" x="250" y="194" font-size="12">about 51x fewer states; every one of the 701 answers still reaches its end state</text></svg>
