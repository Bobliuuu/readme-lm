name: ask
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      mode: {description: "gpt2 or qa", required: true, default: "gpt2"}
      text: {description: "prompt or question", required: true}
permissions:
  contents: write
  issues: write
concurrency: ask
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'gpt2:') || startsWith(github.event.issue.title, 'qa:')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      TITLE: ${{ github.event.issue.title }}
      ISSUE: ${{ github.event.issue.number }}
      IN_MODE: ${{ inputs.mode }}
      IN_TEXT: ${{ inputs.text }}
      RUNNUM: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy regex
      - name: write the issue text into the document's run block
        run: |
          if [ "$EVENT" = issues ]; then
            case "$TITLE" in qa:*) MODE=qa; P="${TITLE#qa:}";; *) MODE=gpt2; P="${TITLE#gpt2:}";; esac; SEED="$ISSUE"; N="$ISSUE"
          else MODE="$IN_MODE"; P="$IN_TEXT"; SEED="$RUNNUM"; N="run$RUNNUM"; fi
          P="$(printf '%s' "$P" | tr -d '\r\n`' | sed 's/^ *//; s/ *$//' | cut -c1-300)"
          echo "MODE=$MODE" >> "$GITHUB_ENV"; echo "N=$N" >> "$GITHUB_ENV"
          printf '%s' "$P" | sed 's/@/(at)/g' > prompt.txt
          MODE="$MODE" P="$P" SEED="$SEED" python3 - <<'PY'
          import os, re
          mode, p, seed = os.environ["MODE"], os.environ["P"], os.environ["SEED"]
          d = open({"gpt2": "mdrt/GPT2.md", "qa": "mdrt/QA.md"}[mode]).read()
          if mode == "gpt2":
              d = re.sub(r"^prompt: .*$", lambda m: "prompt: " + p, d, count=1, flags=re.M)
              d = re.sub(r"^tokens: \d+$", "tokens: 40", d, count=1, flags=re.M)
              d = re.sub(r"^seed: \d+$", "seed: " + seed, d, count=1, flags=re.M)
          else:
              d = re.sub(r"^question: .*$", lambda m: "question: " + p, d, count=1, flags=re.M)
          open("mdrt/_run.md", "w").write(d)
          PY
      - name: run the Markdown document (engine, program and weights all come from Markdown)
        run: |
          BOOT='import re,sys;t=open(sys.argv[1]).read();exec(re.search(chr(96)*4+"python mdrt-engine\n(.*?)\n"+chr(96)*4,t,re.S).group(1))'
          python3 -c "$BOOT" mdrt/_run.md --run-only -o rendered.md
          sed -i 's/@/(at)/g' rendered.md
          sed -n 's/^> //p' rendered.md | head -1 | sed 's/ ⏎ / /g' > typed.txt
      - name: render the animation and publish it
        run: |
          mkdir -p demos
          if [ "$MODE" = gpt2 ]; then META="GPT-2 small · 124M params · int8 · run from Markdown"; LATEST=gpt2/latest.svg; else META="QA transformer · 600K params · 4-bit · run from Markdown"; LATEST=qa/latest.svg; fi
          python3 gpt2/render_svg.py "demos/$MODE-$N.svg" "$(cat prompt.txt)" typed.txt "$META"
          cp "demos/$MODE-$N.svg" "$LATEST"
          H=$(sha1sum "$LATEST" | cut -c1-8)
          sed -i -E "s#$LATEST(\?v=[0-9a-f]+)?#$LATEST?v=${H}#" README.md
          git config user.name "readme-lm[bot]"; git config user.email "readme-lm@users.noreply.github.com"
          git add demos "$LATEST" README.md
          git commit -m "chore: $MODE animation for $N" || true
          git pull --rebase -q; git push
          { echo "**Mode:** \`$MODE\` · **Input:** \`$(cat prompt.txt)\`"; echo; echo "![animation](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/demos/$MODE-$N.svg)"; echo; cat rendered.md; echo; echo "---"; if [ "$MODE" = gpt2 ]; then echo "GPT-2 small (124M, int8) ran from [\`mdrt/GPT2.md\`](https://github.com/${GITHUB_REPOSITORY}/blob/main/mdrt/GPT2.md): the engine, the forward-pass program, the tokenizer and the weights are all Markdown; this reply is the Markdown that document produced. It is a base language model: it continues text and can be odd."; else echo "The 600K-parameter QA transformer ran from [\`mdrt/QA.md\`](https://github.com/${GITHUB_REPOSITORY}/blob/main/mdrt/QA.md) (engine, program and weights are all Markdown). It only knows Jerry's public GitHub repos."; fi; } > comment.md
      - name: reply and close
        if: github.event_name == 'issues'
        run: |
          gh issue comment "$ISSUE" --body-file comment.md
          gh issue close "$ISSUE" --reason completed
      - name: print (manual runs)
        if: github.event_name != 'issues'
        run: cat comment.md
