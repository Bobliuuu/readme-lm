name: gpt2
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      prompt: {description: "prompt", required: true}
permissions:
  contents: write
  issues: write
concurrency: gpt2
jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'gpt2:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      TITLE: ${{ github.event.issue.title }}
      ISSUE: ${{ github.event.issue.number }}
      INPUT: ${{ inputs.prompt }}
      RUNNUM: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy regex
      - name: run GPT-2 from the Markdown shards
        run: |
          if [ "$EVENT" = issues ]; then P="${TITLE#gpt2:}"; else P="$INPUT"; fi
          P="$(printf '%s' "$P" | tr -d '\r`' | sed 's/^ *//; s/ *$//' | cut -c1-400)"
          case "$P" in *\?) FULL="Question: $P"$'\n'"Answer:" ;; *) FULL="$P" ;; esac
          python3 gpt2/run.py "$FULL" 80 "${ISSUE:-0}" 0.8 > out.txt
          printf '%s' "$P" | sed 's/@/(at)/g' > prompt.txt
          printf '%s%s' "$FULL" "$(cat out.txt)" | tr -d '`' | sed 's/@/(at)/g' > typed.txt
      - name: render the animation and publish it
        run: |
          N="${ISSUE:-run$RUNNUM}"
          mkdir -p gpt2/demos
          python3 gpt2/render_svg.py "gpt2/demos/issue-$N.svg" "$(cat prompt.txt)" typed.txt
          cp "gpt2/demos/issue-$N.svg" gpt2/latest.svg
          H=$(sha1sum gpt2/latest.svg | cut -c1-8)
          sed -i -E "s#gpt2/latest\.svg(\?v=[0-9a-f]+)?#gpt2/latest.svg?v=${H}#" README.md
          git config user.name "gpt2[bot]"; git config user.email "gpt2@users.noreply.github.com"
          git add gpt2/demos gpt2/latest.svg README.md
          git commit -m "chore: GPT-2 output animation for $N" || true
          git pull --rebase -q; git push
          { echo "**Prompt:** \`$(cat prompt.txt)\`"; echo; echo "![GPT-2 output animation](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/gpt2/demos/issue-$N.svg)"; echo; echo '````'; cat typed.txt; echo; echo '````'; echo; echo "GPT-2 small (124M params, int8) run in numpy by a GitHub Action. The weights and tokenizer were read from the Markdown files in [\`gpt2/\`](https://github.com/${GITHUB_REPOSITORY}/tree/main/gpt2). It is a base language model, not a chat assistant: it continues text and can be wrong or odd."; } > comment.md
      - name: reply and close
        if: github.event_name == 'issues'
        run: |
          gh issue comment "$ISSUE" --body-file comment.md
          gh issue close "$ISSUE" --reason completed
      - name: print (manual runs)
        if: github.event_name != 'issues'
        run: cat comment.md
